
name: Build NRTV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          if [ -f settings.gradle ]; then
            DIR="."
          elif [ -f NRTVLiveBroadcaster/settings.gradle ]; then
            DIR="NRTVLiveBroadcaster"
          else
            echo "Cannot find Android project settings.gradle"
            exit 1
          fi
          gradle -p "$DIR" --no-daemon assembleDebug
          echo "APK_DIR=$DIR/app/build/outputs/apk/debug" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NRTV-Live-Broadcaster-APK
          path: ${{ env.APK_DIR }}/app-debug.apk
