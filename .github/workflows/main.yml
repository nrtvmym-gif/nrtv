on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android Project
        id: project
        run: |
          FILE=$(find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)
          if [ -z "$FILE" ]; then
            echo "Android settings.gradle not found"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build NRTV
        run: |
          DIR="${{ steps.project.outputs.dir }}"
          chmod +x "$DIR/gradlew"
          "$DIR/gradlew" -p "$DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NRTV-Live-Broadcaster
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
